<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vier Gewinnt</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Vier Gewinnt</h1>
      <p class="subtitle">Du bist <span class="red">Rot</span>. Der Computer ist <span class="yellow">Gelb</span>.</p>

      <section class="controls">
        <button id="restartBtn" type="button">Neu starten</button>
        <p id="status" aria-live="polite"></p>
      </section>

      <section class="board-wrap" aria-label="Vier Gewinnt Spielfeld">
        <div id="columnButtons" class="column-buttons"></div>
        <div id="board" class="board"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
